name: Mirror to personal repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        run: |
          git remote add personal "https://x-access-token:${MIRROR_PAT}@github.com/starvingorange/Tudak-Frontend.git"
          git push personal main --force
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
