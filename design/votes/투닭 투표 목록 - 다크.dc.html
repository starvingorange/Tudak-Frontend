<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>투닭 - 투표 목록 (다크)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<style>
body{margin:0;background:#1c1e21;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#fefefe;text-decoration:none}
a:hover{color:#ffc226}
</style>
</helmet>
<div data-screen-label="투표 목록" style="min-height: 100vh; color: #fefefe; background-color: #1C1E21">

  <!-- NAV -->
  <nav style="background:#1c1e21;border-bottom:1px solid #33363a;position:sticky;top:0;z-index:10">
    <div style="max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:36px;padding:0 16px">
      <img src="assets/logo-nav-dark.png" alt="투닭" style="height:42px;display:block">
      <div style="display:flex;align-items:stretch;gap:8px;height:64px;flex:1">
        <a href="투닭 메인 - 다크.dc.html" style="display:flex;align-items:center;gap:7px;padding:0 14px;font-size:15px;font-weight:600;color:#bdbdbd;border-bottom:3px solid transparent;box-sizing:border-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
          홈
        </a>
        <a href="#" style="display:flex;align-items:center;gap:7px;padding:0 14px;font-size:15px;font-weight:700;color:#fefefe;border-bottom:3px solid #ffc226;box-sizing:border-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>
          투표
        </a>
        <a href="투닭 토론 목록 - 다크.dc.html" style="display:flex;align-items:center;gap:7px;padding:0 14px;font-size:15px;font-weight:600;color:#bdbdbd;border-bottom:3px solid transparent;box-sizing:border-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3.2A8 8 0 1 1 21 12Z"></path></svg>
          토론
        </a>
      </div>
      <div style="display:flex;align-items:center;gap:18px">
        <div style="position:relative;width:24px;height:24px;color:#e6e6e6">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path><path d="M10.3 21a2 2 0 0 0 3.4 0"></path></svg>
          <span style="position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #1c1e21"></span>
        </div>
        <img src="assets/avatar.png" alt="프로필" style="width:40px;height:40px;border-radius:50%;display:block">
      </div>
    </div>
  </nav>

  <!-- 헤더 밴드 -->
  

  <main style="max-width:1180px;margin:0 auto;padding:8px 16px 40px">

    <!-- 필터 바 -->
    <div style="background-color: #1C1E21">
    <div style="max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:flex-end;justify-content:space-between">
      <div style="padding:44px 0 36px">
        <h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-0.5px">투표 목록</h1>
        <div style="margin-top:8px;font-size:15px;color:#a3a3a3">다양한 주제로 진행 중인 투표를 확인하고 참여해보세요!</div>
      </div>
      <img src="assets/stickers/st-com-idea.png" alt="투닭 캐릭터" style="height:150px;display:block;margin-right:40px">
    </div>
  </div><div style="border:1px solid #33363a;border-radius:14px;margin-top:24px;padding:18px 22px;display:flex;align-items:flex-end;gap:24px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:#a3a3a3">카테고리</div>
        <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap">
          <button style="display:inline-flex;align-items:center;gap:9px;border:1.5px solid #ffc226;background:#3a3320;color:#fefefe;font-size:14px;font-weight:700;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="#ffc226"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
            전체
          </button>
          <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7b5cd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 6h14"></path><path d="m5 6-2.5 6a3 3 0 0 0 5 0L5 6Z"></path><path d="m19 6-2.5 6a3 3 0 0 0 5 0L19 6Z"></path><path d="M8 21h8"></path></svg>
            시사
          </button>
          <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#f43f5e"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11Z"></path></svg>
            연애
          </button>
          <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#14b8a6"><circle cx="12" cy="7.5" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0Z"></path></svg>
            사회
          </button>
          <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#3b82f6"><path d="m12 3 10 5-10 5L2 8l10-5Z"></path><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5l-6 3-6-3Z"></path></svg>
            학교
          </button>
          <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #33363a;background:#1c1e21;color:#8b8b8b;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#8b8b8b"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
            기타
          </button>
        </div>
      </div>
      <div style="width:220px">
        <div style="font-size:13px;font-weight:700;color:#a3a3a3">정렬</div>
        <div style="margin-top:10px;position:relative">
          <select style="width:100%;appearance:none;border:1px solid #33363a;background:#1c1e21;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;font-family:inherit;color:#fefefe;cursor:pointer">
            <option>최신순</option>
            <option>인기순</option>
            <option>마감임박순</option>
          </select>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
      </div>
    </div>

    <!-- 목록 -->
    <div style="display:flex;flex-direction:column;gap:14px;margin-top:22px">
      <sc-for list="{{ votes }}" as="v" hint-placeholder-count="0">
        <div style="display:flex;align-items:center;gap:20px;border:1px solid #33363a;border-radius:14px;padding:20px 26px" style-hover="border-color:#ffc226">
          <span style="background:{{ v.catBg }};color:{{ v.catFg }};font-size:13px;font-weight:700;padding:6px 15px;border-radius:999px;white-space:nowrap">{{ v.cat }}</span>
          <img src="{{ v.img }}" alt="캐릭터" style="height:46px;display:block">
          <span style="flex:1;font-size:19px;font-weight:800;letter-spacing:-0.3px;min-width:0">{{ v.title }}</span>
          <span style="display:flex;flex-direction:column;gap:5px;align-items:flex-start;width:110px">
            <span style="font-size:13px;font-weight:700;color:#2f6fed">찬성</span>
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#fefefe"><svg width="13" height="13" viewBox="0 0 24 24" fill="#a3a3a3"><circle cx="12" cy="7.5" r="4.5"></circle><path d="M3 21a9 9 0 0 1 18 0Z"></path></svg>{{ v.pro }}</span>
          </span>
          <span style="font-size:14px;font-weight:800;color:#a3a3a3">VS</span>
          <span style="display:flex;flex-direction:column;gap:5px;align-items:flex-start;width:120px">
            <span style="font-size:13px;font-weight:700;color:#ef4444">반대</span>
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#fefefe"><svg width="13" height="13" viewBox="0 0 24 24" fill="#a3a3a3"><circle cx="12" cy="7.5" r="4.5"></circle><path d="M3 21a9 9 0 0 1 18 0Z"></path></svg>{{ v.con }}</span>
          </span>
          <span style="width:1px;height:36px;background:#33363a"></span>
          <span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fefefe;width:78px;justify-content:flex-end"><svg width="16" height="16" viewBox="0 0 24 24" fill="#a3a3a3"><circle cx="9" cy="7.5" r="3.8"></circle><path d="M1.5 20a7.5 7.5 0 0 1 15 0Z"></path><circle cx="17" cy="8.5" r="3"></circle><path d="M14.5 13.4A6.5 6.5 0 0 1 23 19.5h-4.5"></path></svg>{{ v.count }}명</span>
        </div>
      </sc-for>
    </div>

    <!-- 페이지네이션 -->
    <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:30px">
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #33363a;background:#1c1e21;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#a3a3a3" style-hover="border-color:#ffc226"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button style="width:38px;height:38px;border-radius:10px;border:none;background:#ffc226;color:#111111;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">1</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">2</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">3</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">4</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #33363a;background:#1c1e21;color:#fefefe;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">5</button>
      <span style="color:#8b8b8b;padding:0 4px">…</span>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #33363a;background:#1c1e21;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#a3a3a3" style-hover="border-color:#ffc226"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const cats = {
      "시사": ["#2e2842", "#7b5cd6"], "연애": ["#3a2429", "#f43f5e"],
      "사회": ["#1e3531", "#14b8a6"], "학교": ["#222f42", "#3b82f6"],
    };
    const rows = [
      ["시사", "주 4일 근무제, 도입해야 할까?", "민초러버", "치킨왕", 128, "st-pro-basic"],
      ["연애", "연애할 때 나이 차이, 몇 살까지 가능?", "설렘주의", "연애박사", 96, "st-com-idea"],
      ["사회", "청년 기본소득, 지급해야 할까?", "토닥이123", "현실주의자", 74, "st-con-basic"],
      ["시사", "탄소세 도입, 환경에 도움이 될까?", "경제탐험가", "자유로운영혼", 55, "st-pro-think"],
      ["사회", "AI가 판사를 대신하는 시대, 가능할까?", "미래생각", "인간최우선", 63, "st-com-surprise"],
      ["연애", "데이트 비용은 누가 부담하는 게 맞을까?", "연애박사", "계산적인사람", 41, "st-con-think"],
    ];
    return {
      votes: rows.map(([cat, title, pro, con, count, img]) => ({
        cat, title, pro, con,
        count,
        catBg: cats[cat][0], catFg: cats[cat][1],
        img: "assets/stickers/" + img + ".png",
      })),
    };
  }
}
</script>
</body>
</html>
