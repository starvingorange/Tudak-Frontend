<!DOCTYPE html>
<html>
<head>

<body>
<x-dc>
<helmet>
<meta charset="utf-8">
<title>투닭 - 토론 목록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<style>
body{margin:0;background:#fefefe;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1a1a1a;text-decoration:none}
a:hover{color:#ffc226}
</style>
</helmet>
<div data-screen-label="토론 목록" style="min-height: 100vh; color: #1a1a1a; background-color: #FEFEFE">

  <!-- NAV -->
  <nav style="background:#fefefe;border-bottom:1px solid #ebe9e4;position:sticky;top:0;z-index:10">
    <div style="max-width:1180px;margin:0 auto;height:64px;display:flex;align-items:center;gap:36px;padding:0 16px">
      <img src="assets/logo-nav-light.png" alt="투닭" style="height:42px;display:block">
      <div style="display:flex;align-items:stretch;gap:8px;height:64px;flex:1">
        <a href="투닭 메인 - 라이트.dc.html" style="display:flex;align-items:center;gap:7px;padding:0 14px;font-size:15px;font-weight:600;color:#555555;border-bottom:3px solid transparent;box-sizing:border-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
          홈
        </a>
        <a href="투닭 투표 목록.dc.html" style="display:flex;align-items:center;gap:7px;padding:0 14px;font-size:15px;font-weight:600;color:#555555;border-bottom:3px solid transparent;box-sizing:border-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><path d="m8.5 12 2.5 2.5 4.5-5"></path></svg>
          투표
        </a>
        <a href="#" style="display:flex;align-items:center;gap:7px;padding:0 14px;font-size:15px;font-weight:700;color:#1a1a1a;border-bottom:3px solid #ffc226;box-sizing:border-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2-3.2A8 8 0 1 1 21 12Z"></path></svg>
          토론
        </a>
      </div>
      <div style="display:flex;align-items:center;gap:18px">
        <div style="position:relative;width:24px;height:24px;color:#333333">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"></path><path d="M10.3 21a2 2 0 0 0 3.4 0"></path></svg>
          <span style="position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #fefefe"></span>
        </div>
        <img src="assets/avatar.png" alt="프로필" style="width:40px;height:40px;border-radius:50%;display:block">
      </div>
    </div>
  </nav>

  <!-- 헤더 밴드 -->
  

  <main style="max-width:1180px;margin:0 auto;padding:8px 16px 40px">

    <!-- 필터 바 -->
    <div style="border-bottom: 1px solid #ebe9e4; background-color: #FEFEFE">
    <div style="max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:flex-end;justify-content:space-between">
      <div style="padding:44px 0 36px">
        <h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-0.5px">토론 목록</h1>
        <div style="margin-top:8px;font-size:15px;color:#6f6f6f">다양한 주제로 열려있는 토론방에 참여해보세요!</div>
      </div>
      <img src="assets/stickers/st-pro-speak.png" alt="투닭 캐릭터" style="height:150px;display:block;margin-right:40px">
    </div>
  </div><div style="border:1px solid #ebe9e4;border-radius:14px;margin-top:24px;padding:16px 18px;display:flex;gap:12px;flex-wrap:wrap">
      <button style="display:inline-flex;align-items:center;gap:9px;border:1.5px solid #ffc226;background:#fffdf5;color:#1a1a1a;font-size:14px;font-weight:700;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#7a4a12"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="8" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect><rect x="13" y="13" width="8" height="8" rx="1.5"></rect></svg>
        전체
      </button>
      <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7b5cd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"></path><path d="M5 6h14"></path><path d="m5 6-2.5 6a3 3 0 0 0 5 0L5 6Z"></path><path d="m19 6-2.5 6a3 3 0 0 0 5 0L19 6Z"></path><path d="M8 21h8"></path></svg>
        시사
      </button>
      <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#f43f5e"><path d="M12 21s-8-5.5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.5-8 11-8 11Z"></path></svg>
        연애
      </button>
      <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#14b8a6"><circle cx="12" cy="7.5" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0Z"></path></svg>
        사회
      </button>
      <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#3b82f6"><path d="m12 3 10 5-10 5L2 8l10-5Z"></path><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5l-6 3-6-3Z"></path></svg>
        학교
      </button>
      <button style="display:inline-flex;align-items:center;gap:9px;border:1px solid #ebe9e4;background:#fefefe;color:#909090;font-size:14px;font-weight:600;padding:11px 24px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#909090"><circle cx="6" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="18" cy="12" r="1.6"></circle></svg>
        기타
      </button>
    </div>

    <!-- 목록 (카드 그리드) -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:22px">
      <sc-for list="{{ rooms }}" as="r" hint-placeholder-count="0">
        <div style="border:1px solid #ebe9e4;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column" style-hover="border-color:#ffc226">
          <div style="display:flex;align-items:center">
            <span style="background:{{ r.catBg }};color:{{ r.catFg }};font-size:12px;font-weight:700;padding:5px 13px;border-radius:999px">{{ r.cat }}</span>
          </div>
          <div style="font-size:18px;font-weight:800;line-height:1.4;letter-spacing:-0.3px;margin-top:14px;min-height:50px">{{ r.title }}</div>
          <div style="display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;margin-top:16px">
            <sc-if value="{{ r.hasPro }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
                <span style="width:72px;height:72px;border-radius:50%;background:#eef1fd;border:2px solid #2f6fed;display:inline-flex;align-items:center;justify-content:center;overflow:hidden">
                  <img src="{{ r.proImg }}" alt="찬성" style="height:56px;display:block">
                </span>
                <span style="background:#2f6fed;color:#fff;font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px">찬성</span>
                <span style="font-size:13.5px;font-weight:800;color:#2f6fed">{{ r.proName }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ r.noPro }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
                <span style="width:72px;height:72px;border-radius:50%;background:#fefefe;border:2px dashed #d8d5cf;display:inline-flex;align-items:center;justify-content:center;color:#c2beb6;font-size:26px;font-weight:800;box-sizing:border-box">?</span>
                <span style="border:1px solid #d8d5cf;color:#909090;font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px">찬성</span>
                <span style="font-size:13.5px;font-weight:700;color:#909090">공석</span>
              </div>
            </sc-if>
            <span style="text-align:center;font-size:14px;font-weight:800;color:#909090">VS</span>
            <sc-if value="{{ r.hasCon }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
                <span style="width:72px;height:72px;border-radius:50%;background:#fdecec;border:2px solid #ef4444;display:inline-flex;align-items:center;justify-content:center;overflow:hidden">
                  <img src="{{ r.conImg }}" alt="반대" style="height:56px;display:block">
                </span>
                <span style="background:#ef4444;color:#fff;font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px">반대</span>
                <span style="font-size:13.5px;font-weight:800;color:#ef4444">{{ r.conName }}</span>
              </div>
            </sc-if>
            <sc-if value="{{ r.noCon }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
                <span style="width:72px;height:72px;border-radius:50%;background:#fefefe;border:2px dashed #d8d5cf;display:inline-flex;align-items:center;justify-content:center;color:#c2beb6;font-size:26px;font-weight:800;box-sizing:border-box">?</span>
                <span style="border:1px solid #d8d5cf;color:#909090;font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px">반대</span>
                <span style="font-size:13.5px;font-weight:700;color:#909090">공석</span>
              </div>
            </sc-if>
          </div>
          <div style="flex:1"></div>
          <div style="display:flex;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid #ebe9e4">
            <button onClick="{{ r.openModal }}" style="{{ r.joinStyle }}">{{ r.joinLabel }}</button>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- 페이지네이션 -->
    <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:30px">
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #ebe9e4;background:#fefefe;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#6f6f6f" style-hover="border-color:#ffc226"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button style="width:38px;height:38px;border-radius:10px;border:none;background:#ffc226;color:#111111;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit">1</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">2</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">3</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">4</button>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit" style-hover="border-color:#ffc226">5</button>
      <span style="color:#909090;padding:0 4px">…</span>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid #ebe9e4;background:#fefefe;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#6f6f6f" style-hover="border-color:#ffc226"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button>
    </div>
  </main>

  <!-- 참여 모달 -->
  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="참여 모달" style="position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center" onClick="{{ closeModal }}">
      <div style="background:#fefefe;border-radius:16px;width:480px;max-width:92vw;padding:28px 30px;box-sizing:border-box" onClick="{{ stopClick }}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
          <div>
            <div style="font-size:13px;font-weight:700;color:#909090">토론 참여</div>
            <div style="font-size:21px;font-weight:800;letter-spacing:-0.3px;margin-top:6px;line-height:1.35">{{ modalTitle }}</div>
          </div>
          <button onClick="{{ closeModal }}" style="border:none;background:transparent;cursor:pointer;color:#909090;padding:4px;line-height:1" style-hover="color:#1a1a1a"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:22px">
          <button onClick="{{ pickPro }}" disabled="{{ proTaken }}" style="{{ proOptStyle }}">
            <span style="background:#2f6fed;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;flex-shrink:0">찬성</span>
            <span style="flex:1;text-align:left;font-size:15px;font-weight:700">{{ proLabel }}</span>
            <sc-if value="{{ proTaken }}" hint-placeholder-val="{{ false }}">
              <span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#909090"><img src="{{ hostImg }}" alt="방장" style="height:26px">{{ hostName }} (방장)</span>
            </sc-if>
            <sc-if value="{{ proPickable }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:12.5px;font-weight:700;color:#22a54a">선택 가능</span>
            </sc-if>
          </button>
          <button onClick="{{ pickCon }}" disabled="{{ conTaken }}" style="{{ conOptStyle }}">
            <span style="background:#ef4444;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;flex-shrink:0">반대</span>
            <span style="flex:1;text-align:left;font-size:15px;font-weight:700">{{ conLabel }}</span>
            <sc-if value="{{ conTaken }}" hint-placeholder-val="{{ false }}">
              <span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#909090"><img src="{{ hostImg }}" alt="방장" style="height:26px">{{ hostName }} (방장)</span>
            </sc-if>
            <sc-if value="{{ conPickable }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:12.5px;font-weight:700;color:#22a54a">선택 가능</span>
            </sc-if>
          </button>
        </div>
        <div style="margin-top:12px;font-size:12.5px;color:#909090">방장이 선택한 입장은 변경할 수 없어요. 남은 입장으로 참여합니다.</div>
        <div style="display:flex;gap:10px;margin-top:22px">
          <button onClick="{{ closeModal }}" style="flex:1;border:1px solid #ebe9e4;background:#fefefe;color:#1a1a1a;font-size:14px;font-weight:700;padding:13px 0;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:#c9c5bd">취소</button>
          <a href="투닭 토론 인게임.dc.html" style="{{ confirmStyle }}">{{ confirmLabel }}</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { modal: null, picked: null };

  renderVals() {
    const cats = { "시사": ["#f6f2fe", "#7b5cd6"], "연애": ["#fdeef1", "#f43f5e"], "사회": ["#e9f8f5", "#14b8a6"], "학교": ["#eaf2fe", "#3b82f6"] };
    const rows = [
      ["시사", "주 4일 근무제, 도입해야 할까?", "민초러버", "st-pro-basic", null, null],
      ["연애", "연애할 때 나이 차이, 몇 살까지 가능?", null, null, "치킨왕", "st-con-basic"],
      ["사회", "청년 기본소득, 지급해야 할까?", "토닥이123", "st-com-idea", null, null],
      ["학교", "대학교 등록금, 지금이 적정할까?", null, null, "공부하자", "st-con-think"],
      ["시사", "탄소세 도입, 환경에 도움이 될까?", "지구지킴이", "st-pro-think", null, null],
      ["사회", "AI가 판사를 대신하는 시대, 가능할까?", null, null, "미래생각", "st-con-speak"],
    ];
    const joinBase = { display: "inline-flex", alignItems: "center", gap: 7, fontSize: 13, fontWeight: 800, padding: "9px 20px", borderRadius: 8, textDecoration: "none", border: "none", cursor: "pointer", fontFamily: "inherit" };
    const labels = {
      "주 4일 근무제, 도입해야 할까?": ["도입해야 한다", "도입하지 말아야 한다"],
      "연애할 때 나이 차이, 몇 살까지 가능?": ["나이는 숫자일 뿐이다", "적정선이 있다"],
      "청년 기본소득, 지급해야 할까?": ["지급해야 한다", "지급하지 말아야 한다"],
      "대학교 등록금, 지금이 적정할까?": ["적정하다", "너무 비싸다"],
      "탄소세 도입, 환경에 도움이 될까?": ["도움이 된다", "효과가 없다"],
      "AI가 판사를 대신하는 시대, 가능할까?": ["가능하다", "불가능하다"],
    };
    const m = this.state.modal;
    const picked = this.state.picked;
    const optBase = { display: "flex", alignItems: "center", gap: 12, padding: "15px 16px", borderRadius: 12, fontFamily: "inherit", background: "#fefefe", width: "100%", boxSizing: "border-box" };
    const optStyle = (side, taken) => {
      const color = side === "pro" ? "#2f6fed" : "#ef4444";
      const tint = side === "pro" ? "#eef1fd" : "#fdecec";
      if (taken) return { ...optBase, border: "1px solid #ebe9e4", background: "#faf9f7", cursor: "default", opacity: 0.75 };
      return { ...optBase, cursor: "pointer", border: picked === side ? "2px solid " + color : "1px solid #ebe9e4", background: picked === side ? tint : "#fefefe" };
    };
    const modalVals = m ? (() => {
      const proTaken = m.hasPro, conTaken = m.hasCon;
      const canConfirm = picked !== null;
      return {
        modalOpen: true,
        modalTitle: m.title,
        proLabel: labels[m.title][0], conLabel: labels[m.title][1],
        proTaken, conTaken,
        proPickable: !proTaken, conPickable: !conTaken,
        hostImg: proTaken ? m.proImg : m.conImg,
        hostName: proTaken ? m.proName : m.conName,
        proOptStyle: optStyle("pro", proTaken),
        conOptStyle: optStyle("con", conTaken),
        pickPro: () => !proTaken && this.setState({ picked: "pro" }),
        pickCon: () => !conTaken && this.setState({ picked: "con" }),
        confirmLabel: canConfirm ? (picked === "pro" ? "찬성으로 참여하기" : "반대로 참여하기") : "입장을 선택하세요",
        confirmStyle: {
          flex: 1.4, display: "inline-flex", alignItems: "center", justifyContent: "center",
          fontSize: 14, fontWeight: 800, padding: "13px 0", borderRadius: 10, textDecoration: "none",
          background: canConfirm ? "#ffc226" : "#efedea", color: canConfirm ? "#111111" : "#a3a09a",
          pointerEvents: canConfirm ? "auto" : "none",
        },
      };
    })() : { modalOpen: false };
    return {
      ...modalVals,
      closeModal: () => this.setState({ modal: null, picked: null }),
      stopClick: (e) => e.stopPropagation(),
      rooms: rows.map(([cat, title, proName, proImg, conName, conImg]) => ({
        cat, title,
        catBg: cats[cat][0], catFg: cats[cat][1],
        hasPro: proName !== null,
        noPro: proName === null,
        proName: proName || "",
        proImg: proImg ? "assets/stickers/" + proImg + ".png" : "",
        hasCon: conName !== null,
        noCon: conName === null,
        conName: conName || "",
        conImg: conImg ? "assets/stickers/" + conImg + ".png" : "",
        joinLabel: "참여하기",
        joinStyle: { ...joinBase, background: "#ffc226", color: "#111111" },
        openModal: () => this.setState({
          modal: {
            title,
            hasPro: proName !== null, hasCon: conName !== null,
            proName: proName || "", conName: conName || "",
            proImg: proImg ? "assets/stickers/" + proImg + ".png" : "",
            conImg: conImg ? "assets/stickers/" + conImg + ".png" : "",
          },
          picked: proName === null ? "pro" : "con",
        }),
      })),
    };
  }
}
</script>
</body>
</html>
